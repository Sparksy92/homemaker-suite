<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Calc</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fdfcf6;
            color: #2c3e50;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
            color: #4a6741;
        }

        h2 {
            color: #e67e22;
            font-size: 1.2em;
            border-bottom: 2px solid #fcebb6;
            padding-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4a6741;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #3a5233;
        }

        .result {
            background: #f0f7ef;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }

        .row {
            display: flex;
            gap: 10px;
        }
    </style>
</head>

<body>
    <h1>🛠️ Workshop Calc</h1>

    <!-- Concrete -->
    <div class="card">
        <h2>Concrete Slab</h2>
        <div class="row">
            <input type="number" id="c-len" placeholder="Length (ft)">
            <input type="number" id="c-wid" placeholder="Width (ft)">
        </div>
        <input type="number" id="c-dep" placeholder="Depth (inches)" value="4">
        <button onclick="calcConcrete()">Calculate Bags (80lb)</button>
        <div id="res-concrete" class="result"></div>
    </div>

    <!-- Framing -->
    <div class="card">
        <h2>Wall Framing</h2>
        <input type="number" id="f-len" placeholder="Wall Linear Length (ft)">
        <button onclick="calcFraming()">Calculate 2x4 Studs (16" OC)</button>
        <div id="res-framing" class="result"></div>
    </div>

    <script>
        function calcConcrete() {
            const l = parseFloat(document.getElementById('c-len').value) || 0;
            const w = parseFloat(document.getElementById('c-wid').value) || 0;
            const d = parseFloat(document.getElementById('c-dep').value) || 0;

            // Volume in Cubic Feet = L * W * (D/12)
            const cuFt = l * w * (d / 12);
            // Cubic Yards = cuFt / 27
            const yards = cuFt / 27;
            // 80lb bag yields ~0.6 cu ft.
            const bags = Math.ceil(cuFt / 0.6);

            const div = document.getElementById('res-concrete');
            div.style.display = 'block';
            div.innerHTML = `
                Volume: ${cuFt.toFixed(1)} cu.ft (${yards.toFixed(1)} yards)<br>
                Bags Needed: <span style="color:#e67e22; font-size:1.5em">${bags}</span> (80lb pre-mix)
            `;
        }

        function calcFraming() {
            const l = parseFloat(document.getElementById('f-len').value) || 0;

            // 1 stud every 16 inches (1.33 ft) + 1 starter + waste
            const studs = Math.ceil((l * 12) / 16) + 1;
            // Add 10% waste/corners
            const total = Math.ceil(studs * 1.1);

            // Plates (Top, Bottom, Top-Double) = L * 3
            const plateLinFt = l * 3;
            // 2x4x8s needed for plates
            const plateBoards = Math.ceil(plateLinFt / 8);

            const div = document.getElementById('res-framing');
            div.style.display = 'block';
            div.innerHTML = `
                Vertical Studs: <b>${total}</b> (2x4)<br>
                Plate Material: <b>${plateBoards}</b> (2x4x8)
            `;
        }
    </script>
</body>

</html>
