<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantry Manager</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fdfcf6;
            color: #2c3e50;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
            color: #d35400;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background: #d35400;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .list-item {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            padding: 15px;
            border-bottom: 1px solid #eee;
            align-items: center;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .expired {
            color: #c0392b;
            font-weight: bold;
        }

        .warning {
            color: #e67e22;
        }

        .good {
            color: #27ae60;
        }
    </style>
</head>

<body>
    <h1>🥫 Pantry Manager</h1>

    <div class="card">
        <h3>Add Item</h3>
        <div class="grid">
            <input type="text" id="name" placeholder="Item Name (e.g. Rice)">
            <input type="number" id="qty" placeholder="Qty">
            <input type="date" id="exp">
            <button onclick="addItem()">Add</button>
        </div>
    </div>

    <div class="card">
        <h3>Inventory</h3>
        <div id="list">
            <!-- Items go here -->
        </div>
    </div>

    <script>
        // Simple LocalStorage Persistence
        let inventory = JSON.parse(localStorage.getItem('pantry_v1')) || [
            { id: 1, name: "White Rice (Bucket)", qty: 5, exp: "2030-01-01" },
            { id: 2, name: "Canned Beans", qty: 24, exp: "2025-12-31" },
        ];

        function save() {
            localStorage.setItem('pantry_v1', JSON.stringify(inventory));
            render();
        }

        function addItem() {
            const name = document.getElementById('name').value;
            const qty = document.getElementById('qty').value;
            const exp = document.getElementById('exp').value;

            if (!name || !qty || !exp) return alert("Fill all fields");

            inventory.push({
                id: Date.now(),
                name,
                qty,
                exp
            });

            // Clear inputs
            document.getElementById('name').value = '';
            document.getElementById('qty').value = '';

            save();
        }

        function removeItem(id) {
            inventory = inventory.filter(i => i.id !== id);
            save();
        }

        function getStatus(expDate) {
            const today = new Date();
            const exp = new Date(expDate);
            const monthsLeft = (exp - today) / (1000 * 60 * 60 * 24 * 30);

            if (monthsLeft < 0) return { text: "EXPIRED", class: "expired" };
            if (monthsLeft < 6) return { text: "Use Soon", class: "warning" };
            return { text: "Good", class: "good" };
        }

        function render() {
            const container = document.getElementById('list');
            container.innerHTML = '';

            // Sort by expiration (soonest first)
            inventory.sort((a, b) => new Date(a.exp) - new Date(b.exp));

            inventory.forEach(item => {
                const status = getStatus(item.exp);

                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div>
                        <strong>${item.name}</strong>
                        <div style="font-size: 0.8em; color: #7f8c8d">Exp: ${item.exp}</div>
                    </div>
                    <div style="font-weight: bold;">x${item.qty}</div>
                    <div class="${status.class}">${status.text}</div>
                    <button onclick="removeItem(${item.id})" style="background: #e74c3c; padding: 5px 10px;">X</button>
                `;
                container.appendChild(div);
            });
        }

        // Init
        render();
    </script>
</body>

</html>
