<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Purification Calculator</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            background-color: #f0f9ff;
            color: #334155;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 1px solid #bae6fd;
        }

        h1 {
            color: #0284c7;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #0369a1;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #f8fafc;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0284c7;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background-color: #e0f2fe;
            border-radius: 8px;
            border: 1px solid #bae6fd;
            display: none;
        }

        .result h3 {
            margin-top: 0;
            color: #0c4a6e;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            border-bottom: 1px dashed #7dd3fc;
            padding-bottom: 8px;
        }

        .stat:last-child {
            border-bottom: none;
        }

        .warning {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>💧 Water Purification</h1>

        <div class="input-group">
            <label>Water Volume</label>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="volume" placeholder="e.g. 1" value="1" />
                <select id="unit" style="width: 100px;">
                    <option value="gallons">Gallons</option>
                    <option value="liters">Liters</option>
                    <option value="quarts">Quarts</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>Purification Method</label>
            <select id="method" onchange="toggleInputs()">
                <option value="bleach_6">Bleach (Regular 6%)</option>
                <option value="bleach_8">Bleach (Concentrated 8.25%)</option>
                <option value="iodine">Iodine (2% Tincture)</option>
                <option value="boiling">Boiling (Traditional)</option>
                <option value="sodis">SODIS (Solar Disinfection)</option>
            </select>
        </div>

        <!-- Dynamic Inputs -->
        <div id="chemical-inputs" class="input-group">
            <label>Water Clarity</label>
            <select id="clarity">
                <option value="clear">Clear / Filtered</option>
                <option value="cloudy">Cloudy / Cold</option>
            </select>
        </div>

        <div id="boiling-inputs" class="input-group" style="display: none;">
            <label>Location Altitude</label>
            <select id="altitude">
                <option value="low">Low Altitude (< 6,500 ft)</option>
                <option value="high">High Altitude (> 6,500 ft)</option>
            </select>
        </div>

        <div id="sodis-inputs" class="input-group" style="display: none;">
            <label>Sunlight Conditions</label>
            <select id="sunlight">
                <option value="full">Direct Full Sun</option>
                <option value="cloudy">Partially Cloudy</option>
            </select>
            <div class="note">Requires clear PET plastic bottles (under 2L).</div>
        </div>

        <button onclick="calculate()">Calculate Treatment</button>

        <div id="result" class="result">
            <h3>Treatment Required</h3>
            <div class="stat">
                <span>Action:</span>
                <strong id="actionText">-</strong>
            </div>
            <div class="stat">
                <span id="waitLabel">Wait Time:</span>
                <strong id="waitTime">-</strong>
            </div>

            <div id="safetyNote" class="warning">
                <strong>Safety Check:</strong> After treatment, ensure water is handled with clean hands and stored in
                sanitized containers.
            </div>
        </div>
    </div>

    <script>
        function toggleInputs() {
            const method = document.getElementById('method').value;
            document.getElementById('chemical-inputs').style.display = (method.includes('bleach') || method === 'iodine') ? 'block' : 'none';
            document.getElementById('boiling-inputs').style.display = (method === 'boiling') ? 'block' : 'none';
            document.getElementById('sodis-inputs').style.display = (method === 'sodis') ? 'block' : 'none';
            document.getElementById('result').style.display = 'none';
        }

        function calculate() {
            const volumeInput = parseFloat(document.getElementById('volume').value);
            const unit = document.getElementById('unit').value;
            const method = document.getElementById('method').value;

            if (!volumeInput || volumeInput <= 0) {
                alert("Please enter a valid volume");
                return;
            }

            // Convert everything to Gallons first for consistency
            let gallons = 0;
            if (unit === 'gallons') gallons = volumeInput;
            if (unit === 'liters') gallons = volumeInput * 0.264172;
            if (unit === 'quarts') gallons = volumeInput * 0.25;

            let actionText = "";
            let waitTime = "";
            let waitLabel = "Wait Time:";

            if (method.includes('bleach') || method === 'iodine') {
                const clarity = document.getElementById('clarity').value;
                let dropsPerGallon = 0;
                waitTime = "30 Minutes";

                if (method === 'bleach_6') dropsPerGallon = 8;
                else if (method === 'bleach_8') dropsPerGallon = 6;
                else if (method === 'iodine') dropsPerGallon = 20;

                if (clarity === 'cloudy') {
                    dropsPerGallon *= 2;
                    if (method === 'iodine') waitTime = "60 Minutes";
                }

                let totalDrops = Math.ceil(dropsPerGallon * gallons);
                actionText = `Add ${totalDrops} Drops`;
                if (totalDrops >= 64) {
                    const teaspoons = (totalDrops / 64).toFixed(1);
                    actionText = `Add ${teaspoons} Teaspoons (${totalDrops} drops)`;
                }
                document.getElementById('safetyNote').innerHTML = "<strong>Safety Check:</strong> After waiting, water should smell slightly of chlorine/iodine. If not, repeat dosage and wait another 15 minutes.";
            }
            else if (method === 'boiling') {
                const altitude = document.getElementById('altitude').value;
                waitLabel = "Boil Time:";
                actionText = "Bring water to a rolling boil";
                waitTime = (altitude === 'high') ? "3 Minutes" : "1 Minute";
                document.getElementById('safetyNote').innerHTML = "<strong>Safety Check:</strong> Time starts once the water reaches a continuous rolling boil. Let cool naturally before drinking.";
            }
            else if (method === 'sodis') {
                const sunlight = document.getElementById('sunlight').value;
                waitLabel = "Exposure Time:";
                actionText = "Place bottles on a reflective surface in sun";
                waitTime = (sunlight === 'cloudy') ? "2 Days" : "6 Hours";
                document.getElementById('safetyNote').innerHTML = "<strong>Safety Check:</strong> Only use PET bottles (Recycle #1), not glass or PVC. If very cloudy, SODIS is not recommended; use boiling.";
            }

            document.getElementById('actionText').innerText = actionText;
            document.getElementById('waitTime').innerText = waitTime;
            document.getElementById('waitLabel').innerText = waitLabel;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>

</html>
