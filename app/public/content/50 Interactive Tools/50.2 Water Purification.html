<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Purification Calculator</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            background-color: #f0f9ff;
            color: #334155;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 1px solid #bae6fd;
        }

        h1 {
            color: #0284c7;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #0369a1;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #f8fafc;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0284c7;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background-color: #e0f2fe;
            border-radius: 8px;
            border: 1px solid #bae6fd;
            display: none;
        }

        .result h3 {
            margin-top: 0;
            color: #0c4a6e;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            border-bottom: 1px dashed #7dd3fc;
            padding-bottom: 8px;
        }

        .stat:last-child {
            border-bottom: none;
        }

        .warning {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>💧 Water Purification</h1>

        <div class="input-group">
            <label>Water Volume</label>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="volume" placeholder="e.g. 1" value="1" />
                <select id="unit" style="width: 100px;">
                    <option value="gallons">Gallons</option>
                    <option value="liters">Liters</option>
                    <option value="quarts">Quarts</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>Purification Method</label>
            <select id="method">
                <option value="bleach_6">Bleach (Regular 6%)</option>
                <option value="bleach_8">Bleach (Concentrated 8.25%)</option>
                <option value="iodine">Iodine (2% Tincture)</option>
            </select>
        </div>

        <div class="input-group">
            <label>Water Clarity</label>
            <select id="clarity">
                <option value="clear">Clear / Filtered</option>
                <option value="cloudy">Cloudy / Cold</option>
            </select>
        </div>

        <button onclick="calculate()">Calculate Dosage</button>

        <div id="result" class="result">
            <h3>Treatment Required</h3>
            <div class="stat">
                <span>Add:</span>
                <strong id="dropsAmount">-</strong>
            </div>
            <div class="stat">
                <span>Wait Time:</span>
                <strong id="waitTime">30 Minutes</strong>
            </div>

            <div class="warning">
                <strong>Safety Check:</strong> After waiting, water should smell slightly of chlorine/iodine. If not,
                repeat dosage and wait another 15 minutes.
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const volumeInput = parseFloat(document.getElementById('volume').value);
            const unit = document.getElementById('unit').value;
            const method = document.getElementById('method').value;
            const clarity = document.getElementById('clarity').value;

            if (!volumeInput || volumeInput <= 0) {
                alert("Please enter a valid volume");
                return;
            }

            // Convert everything to Gallons first
            let gallons = 0;
            if (unit === 'gallons') gallons = volumeInput;
            if (unit === 'liters') gallons = volumeInput * 0.264172;
            if (unit === 'quarts') gallons = volumeInput * 0.25;

            let dropsPerGallon = 0;
            let waitTime = "30 Minutes";

            // Base Ratios (Standard survival/EPA data)
            // 8 drops (1/8 tsp) per gallon for clear water using 6% bleach
            // 6 drops per gallon for 8.25% bleach
            // Iodine: 5-10 drops per quart (20-40 per gallon)

            if (method === 'bleach_6') {
                dropsPerGallon = 8;
            } else if (method === 'bleach_8') {
                dropsPerGallon = 6;
            } else if (method === 'iodine') {
                dropsPerGallon = 20; // 5 drops per quart * 4
            }

            // Double dosage for cloudy/cold water
            if (clarity === 'cloudy') {
                dropsPerGallon *= 2;
                if (method === 'iodine') waitTime = "60 Minutes"; // Iodine needs more time in cold/cloudy
            }

            // Calculate total drops
            let totalDrops = Math.ceil(dropsPerGallon * gallons);

            // Format result (Convert to Teaspoons if large amount)
            let resultText = `${totalDrops} Drops`;

            // ~98 drops in a teaspoon (approx survival rule of thumb, varies by dropper)
            // EPA says ~8 drops is 1/8 teaspoon. So 64 drops = 1 tsp. Let's use 75 roughly.
            // Actually, standard medical drop is 20 drops/ml. 5ml/tsp. = 100 drops/tsp.
            // EPA: "8 drops (about 1/8 teaspoon)". 8 * 8 = 64 drops/tsp. Let's stick to EPA math.

            if (totalDrops >= 64) {
                const teaspoons = (totalDrops / 64).toFixed(1);
                resultText = `${teaspoons} Teaspoons (${totalDrops} drops)`;
            }

            document.getElementById('dropsAmount').innerText = resultText;
            document.getElementById('waitTime').innerText = waitTime;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>

</html>
