<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Rations</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fdfcf6;
            color: #2c3e50;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
            color: #d35400;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #2c3e50;
            font-size: 0.9em;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: #fdf2e9;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #fadbd8;
        }

        .stat-val {
            font-size: 1.5em;
            font-weight: bold;
            color: #d35400;
        }

        .stat-label {
            font-size: 0.8em;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #d35400;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>🥣 Ration Planner</h1>

    <div class="card">
        <label>Gender</label>
        <select id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <div style="display: flex; gap: 10px;">
            <div style="flex:1">
                <label>Weight (kg)</label>
                <input type="number" id="weight" value="70">
            </div>
            <div style="flex:1">
                <label>Height (cm)</label>
                <input type="number" id="height" value="175">
            </div>
        </div>

        <label>Age</label>
        <input type="number" id="age" value="30">

        <label>Activity Level</label>
        <select id="activity">
            <option value="1.2">Sedentary (Bunker)</option>
            <option value="1.375">Light (Gardening)</option>
            <option value="1.55">Moderate (Patrol/Build)</option>
            <option value="1.725">Heavy (Logging/Hauling)</option>
        </select>

        <button onclick="calculate()">Calculate Needs</button>

        <div class="result-grid">
            <div class="stat-box">
                <div class="stat-val" id="bmr">-</div>
                <div class="stat-label">BMR (Coma)</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="tdee">-</div>
                <div class="stat-label">Daily Burn</div>
            </div>
        </div>

        <div class="stat-box" style="margin-top: 15px; background: #ebf5fb; border-color:#d6eaf8;">
            <div class="stat-val" id="survival" style="color: #2980b9">-</div>
            <div class="stat-label">Survival Minimum (1200 cal)</div>
        </div>
    </div>

    <script>
        function calculate() {
            const gender = document.getElementById('gender').value;
            const w = parseFloat(document.getElementById('weight').value);
            const h = parseFloat(document.getElementById('height').value);
            const age = parseFloat(document.getElementById('age').value);
            const act = parseFloat(document.getElementById('activity').value);

            // Mifflin-St Jeor Equation
            let bmr = (10 * w) + (6.25 * h) - (5 * age);
            if (gender === 'male') bmr += 5;
            else bmr -= 161;

            const tdee = bmr * act;
            const survival = 1200; // General starvation floor

            document.getElementById('bmr').innerText = Math.round(bmr);
            document.getElementById('tdee').innerText = Math.round(tdee);

            const survEl = document.getElementById('survival');
            survEl.innerText = Math.round(survival);

            // Warn if TDEE is dangerously close to survival
            if (tdee < 1500) survEl.style.color = '#c0392b';
        }
    </script>
</body>

</html>
