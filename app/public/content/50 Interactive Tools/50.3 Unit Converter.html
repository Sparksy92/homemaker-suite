<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Converter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fdfcf6;
            color: #2c3e50;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
        }

        h1 {
            margin-top: 0;
            color: #4a6741;
        }

        .group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #4a6741;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .result-box {
            background: #f0f7ef;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }

        .result-value {
            font-size: 2em;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>⚖️ Unit Converter</h1>

        <div class="group">
            <label>Type</label>
            <select id="type" onchange="updateUnits()">
                <option value="length">Length (m / ft)</option>
                <option value="weight">Weight (kg / lb)</option>
                <option value="temp">Temperature (C / F)</option>
                <option value="liquid">Liquid (L / gal)</option>
            </select>
        </div>

        <div class="group">
            <label>Value</label>
            <input type="number" id="input" placeholder="Enter value" oninput="convert()">
        </div>

        <div class="group">
            <label>From</label>
            <select id="from" onchange="convert()"></select>
        </div>

        <div class="group">
            <label>To</label>
            <select id="to" onchange="convert()"></select>
        </div>

        <div class="result-box">
            <div class="result-value" id="result">-</div>
        </div>
    </div>

    <script>
        const units = {
            length: ['Meters', 'Feet', 'Inches', 'Centimeters', 'Yards'],
            weight: ['Kilograms', 'Pounds', 'Ounces', 'Grams'],
            temp: ['Celsius', 'Fahrenheit'],
            liquid: ['Liters', 'Gallons (US)', 'Quarts', 'Fluid Oz']
        };

        function updateUnits() {
            const type = document.getElementById('type').value;
            const fromSelect = document.getElementById('from');
            const toSelect = document.getElementById('to');

            fromSelect.innerHTML = '';
            toSelect.innerHTML = '';

            units[type].forEach(u => {
                fromSelect.innerHTML += `<option value="${u}">${u}</option>`;
                toSelect.innerHTML += `<option value="${u}">${u}</option>`;
            });

            // Set defaults
            if (type === 'length') toSelect.value = 'Feet';
            if (type === 'weight') toSelect.value = 'Pounds';
            if (type === 'temp') toSelect.value = 'Fahrenheit';
            if (type === 'liquid') toSelect.value = 'Gallons (US)';

            convert();
        }

        function convert() {
            const type = document.getElementById('type').value;
            const val = parseFloat(document.getElementById('input').value);
            const from = document.getElementById('from').value;
            const to = document.getElementById('to').value;

            if (isNaN(val)) {
                document.getElementById('result').innerText = '-';
                return;
            }

            let result;

            if (type === 'temp') {
                if (from === to) result = val;
                else if (from === 'Celsius') result = (val * 9 / 5) + 32;
                else result = (val - 32) * 5 / 9;
            } else {
                // Convert to base unit first (m, kg, L)
                let base;

                // LENGTH (Base: m)
                if (type === 'length') {
                    if (from === 'Meters') base = val;
                    if (from === 'Feet') base = val / 3.28084;
                    if (from === 'Inches') base = val / 39.3701;
                    if (from === 'Centimeters') base = val / 100;
                    if (from === 'Yards') base = val / 1.09361;

                    if (to === 'Meters') result = base;
                    if (to === 'Feet') result = base * 3.28084;
                    if (to === 'Inches') result = base * 39.3701;
                    if (to === 'Centimeters') result = base * 100;
                    if (to === 'Yards') result = base * 1.09361;
                }

                // WEIGHT (Base: kg)
                if (type === 'weight') {
                    if (from === 'Kilograms') base = val;
                    if (from === 'Pounds') base = val / 2.20462;
                    if (from === 'Ounces') base = val / 35.274;
                    if (from === 'Grams') base = val / 1000;

                    if (to === 'Kilograms') result = base;
                    if (to === 'Pounds') result = base * 2.20462;
                    if (to === 'Ounces') result = base * 35.274;
                    if (to === 'Grams') result = base * 1000;
                }

                // LIQUID (Base: L)
                if (type === 'liquid') {
                    if (from === 'Liters') base = val;
                    if (from === 'Gallons (US)') base = val * 3.78541;
                    if (from === 'Quarts') base = val * 0.946353;
                    if (from === 'Fluid Oz') base = val * 0.0295735;

                    if (to === 'Liters') result = base;
                    if (to === 'Gallons (US)') result = base / 3.78541;
                    if (to === 'Quarts') result = base / 0.946353;
                    if (to === 'Fluid Oz') result = base / 0.0295735;
                }
            }

            document.getElementById('result').innerText = result.toFixed(2) + (type === 'temp' ? '°' : '');
        }

        // Init
        updateUnits();
    </script>
</body>

</html>
